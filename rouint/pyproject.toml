[project]
name = "rouint"
version = "0.1.0"
description = "CLI-Based API Endpoint Management and Testing Tool"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click",
    "rich",
    "questionary",
]

[project.scripts]
rouint = "rouint.cli:cli"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
