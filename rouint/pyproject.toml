[project]
name = "rouint"
version = "0.1.0"
description = "CLI-Based API Endpoint Management and Testing Tool"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Kavimugil Rajasekar", email = "kavimugil28@gmail.com"}
]
license = {text = "MIT"}
keywords = ["api", "testing", "curl", "cli", "tui", "endpoint-management"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software :: Utilities",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "click",
    "rich",
    "questionary",
]

[project.scripts]
rouint = "rouint.cli:cli"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
