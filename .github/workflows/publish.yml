name: Publish to PyPI

# Triggered when a GitHub Release is published.
# The maintainer workflow:
#   1. Merge feature branch into main via reviewed PR.
#   2. Update version in pyproject.toml and rouint/__init__.py.
#   3. Create and publish a GitHub Release (e.g. v1.1.0).
#   4. This workflow builds, validates, and publishes to PyPI.

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip build twine

    - name: Build distributions
      run: |
        python -m build

    - name: Validate distributions
      run: |
        python -m twine check dist/*

    - name: Upload distributions as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-distributions
        path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # Use a GitHub environment for deployment protection
    environment:
      name: pypi
      url: https://pypi.org/project/rouint/

    # OIDC permission required for Trusted Publishing
    permissions:
      id-token: write

    steps:
    - name: Download distributions
      uses: actions/download-artifact@v4
      with:
        name: python-distributions
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        print-hash: true
