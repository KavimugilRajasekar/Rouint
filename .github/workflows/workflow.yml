name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Verify Installation
      run: |
        rouint --help

    - name: Check for Syntax Errors
      run: |
        python -c "import rouint.cli; import rouint.core.executor; import rouint.core.manager; import rouint.core.parser"

    - name: Build Package
      run: |
        python -m build
