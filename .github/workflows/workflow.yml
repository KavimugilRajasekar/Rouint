name: CI

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Verify CLI installation
      run: |
        rouint --help

    - name: Check module imports
      run: |
        python -c "import rouint.cli; import rouint.core.executor; import rouint.core.manager; import rouint.core.parser; import rouint.platforms; import rouint.platforms.linux.executor; import rouint.platforms.windows.executor"

    - name: Verify curl availability (Linux)
      if: runner.os == 'Linux'
      run: |
        curl --version

    - name: Verify PowerShell availability (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $PSVersionTable

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short

    - name: Build package
      run: |
        python -m build

    - name: Validate distributions
      run: |
        python -m twine check dist/*

  build-check:
    # Single job to confirm the package builds and validates correctly
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip build twine

    - name: Build distributions
      run: |
        python -m build

    - name: Validate distributions
      run: |
        python -m twine check dist/*
